<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="McNabb">
<meta name="application-name" content="McNabb">
<meta name="theme-color" content="#0F4863">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Collectes, arrosage et climat intérieur de la maison, à Notre-Dame-de-l’Île-Perrot.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>McNabb · Maison</title>
<style>
/* ============================================================
   McNabb · Maison  (NDIP)
   Palette tirée de l'icône : ciel, lagune, pré, argent.
   ============================================================ */
:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --sky-950:#0A3347; --sky-900:#0F4863; --sky-800:#125A7C; --sky-700:#166486; --sky-600:#1F7AA3; --sky-500:#3195BA; --sky-300:#74B5DE; --sky-100:#E3F1F8;
  --lagoon:#34ADA8; --meadow:#6DB54E; --grass:#A8D48D; --lime:#B4D442; --silver:#C2BEB7;
  --bg:#F1F4F7; --card:#FFFFFF; --card-2:#F6F8FA;
  --text:#0D2230; --text-2:#4E6272; --text-3:#8295A3;
  --sep:rgba(13,34,48,.08); --sep-strong:rgba(13,34,48,.14);
  --shadow:0 1px 2px rgba(13,34,48,.05),0 4px 16px rgba(13,34,48,.06);
  --accent:#1F7AA3; --accent-strong:#166486;
  --ok:#23864B; --ok-bg:#E3F4EA; --warn:#A96400; --warn-bg:#FDF0D8; --alert:#C0392B; --alert-bg:#FBE6E4;
  --info:#1B6E94; --info-bg:#E2F0F7; --neutral:#5B6B78; --neutral-bg:#EDF1F4;
  --bar-bg:rgba(250,251,252,.88); --bar-solid:#FAFBFC;
  --hero:linear-gradient(180deg,#0F4863 0%,#166486 32%,#2A89B4 66%,#4FB3C3 100%);
  --hero-night:linear-gradient(180deg,#061925 0%,#0B2C40 45%,#10405A 78%,#185A6A 100%);
  --scrim:#0F4863; --compact-bg:rgba(15,72,99,.86);
  --wave-grass:#A8D48D; --wave-line:#C2BEB7;
  --lcd-bg:linear-gradient(180deg,#DCE7D8,#C6D5C1); --lcd-fg:#16261A; --lcd-bezel:#E3E8EC;
  --step-bg:#E3F1F8; --step-fg:#166486;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071119; --card:#0F1F2B; --card-2:#0B1822;
    --text:#E7F0F6; --text-2:#A3B6C4; --text-3:#6F8595;
    --sep:rgba(231,240,246,.08); --sep-strong:rgba(231,240,246,.15);
    --shadow:0 0 0 .5px rgba(231,240,246,.07);
    --accent:#74B5DE; --accent-strong:#9BCBEA;
    --ok:#5BD08A; --ok-bg:rgba(46,158,91,.17); --warn:#F2B55B; --warn-bg:rgba(217,138,18,.17); --alert:#FF8A7E; --alert-bg:rgba(214,69,69,.19);
    --info:#7CC4EA; --info-bg:rgba(31,122,163,.22); --neutral:#A3B6C4; --neutral-bg:rgba(163,182,196,.12);
    --bar-bg:rgba(9,20,28,.86); --bar-solid:#09141C;
    --hero:linear-gradient(180deg,#06202F 0%,#0B3550 42%,#125070 78%,#1A6878 100%);
    --scrim:#06202F; --compact-bg:rgba(6,32,47,.88);
    --wave-grass:#4F7E47; --wave-line:#6E7B80;
    --lcd-bg:linear-gradient(180deg,#1B2B23,#13201A); --lcd-fg:#A9E8BC; --lcd-bezel:#1B2B37;
    --step-bg:rgba(116,181,222,.16); --step-fg:#9BCBEA;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font:16px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- pages & hero ---------- */
.page{display:none;padding-bottom:calc(104px + var(--safe-b))}
.page.on{display:block;animation:pageIn .26s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{position:relative;color:#fff;background:var(--hero);padding:calc(var(--safe-t) + 8px) 20px 46px;overflow:hidden}
.hero.night{background:var(--hero-night)}
.hero-top,.hero-in{max-width:680px;margin:0 auto}
.hero-top{display:flex;align-items:center;justify-content:space-between;height:42px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:.01em}
.brand img{width:30px;height:30px;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);object-fit:cover}
.lang{height:30px;min-width:46px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13px;letter-spacing:.05em}
.lang:active{background:rgba(255,255,255,.34)}
.lt{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.022em;margin-top:10px}
.hs{font-size:15.5px;opacity:.88;margin-top:3px}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:30px;display:block}
.w-grass{fill:var(--wave-grass)} .w-bg{fill:var(--bg)} .w-line{fill:none;stroke:var(--wave-line);stroke-width:1.6}

/* weather in hero */
.wx{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:16px}
.wx-t{font-size:66px;font-weight:250;line-height:.92;letter-spacing:-.04em}
.wx-r{text-align:right;min-width:0}
.wx-cond{font-size:17px;font-weight:650}
.wx-meta{font-size:14px;opacity:.9;margin-top:3px;line-height:1.4}
.wx-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.wchip{background:rgba(255,255,255,.17);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:650;white-space:nowrap}
.wx-upd{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;opacity:.8;color:#fff;padding:4px 0}
.wx-upd svg{width:14px;height:14px}
.wx-msg{margin-top:14px;font-size:14.5px;opacity:.92;line-height:1.4}

/* ---------- layout ---------- */
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px;gap:10px}
.sec h2{font-size:21px;font-weight:760;letter-spacing:-.012em}
.aside-btn{font-size:14px;font-weight:650;color:var(--accent);padding:4px 0}
.stack>*+*{margin-top:10px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.foot{text-align:center;font-size:12px;color:var(--text-3);margin:28px 10px 6px;line-height:1.5}

/* tones */
.t-ok{--tbg:var(--ok-bg);--tfg:var(--ok);--cbg:var(--ok-bg);--cfg:var(--ok)}
.t-warn{--tbg:var(--warn-bg);--tfg:var(--warn);--cbg:var(--warn-bg);--cfg:var(--warn)}
.t-alert{--tbg:var(--alert-bg);--tfg:var(--alert);--cbg:var(--alert-bg);--cfg:var(--alert)}
.t-info{--tbg:var(--info-bg);--tfg:var(--info);--cbg:var(--info-bg);--cfg:var(--info)}
.t-neutral{--tbg:var(--neutral-bg);--tfg:var(--neutral);--cbg:var(--neutral-bg);--cfg:var(--neutral)}

/* action cards */
.act{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:12px;align-items:start}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;line-height:1;background:var(--tbg,var(--neutral-bg));color:var(--tfg,var(--neutral))}
.tile svg{width:24px;height:24px}
.act h3{font-size:16px;font-weight:660;line-height:1.26;padding-top:1px}
.act p{font-size:14px;color:var(--text-2);margin-top:3px;line-height:1.4}
.chip-line{margin-top:6px}
.act .actions{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.act.is-done{opacity:.62}
.act.is-done .tile{background:var(--ok-bg);color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:720;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--cbg,var(--neutral-bg));color:var(--cfg,var(--neutral))}
.btn{height:36px;padding:0 14px;border-radius:11px;font-weight:650;font-size:14px;background:var(--neutral-bg);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--sky-600);color:#fff}
.btn.ghost{background:none;color:var(--text-3);padding:0 6px}
.btn:active{transform:scale(.96)}
.btn.block{width:100%;justify-content:center;height:46px;border-radius:13px;font-size:15.5px}
.empty{text-align:center;padding:22px 14px}
.empty .e{font-size:34px}
.empty b{display:block;font-size:17px;margin-top:6px}
.empty span{display:block;color:var(--text-2);font-size:14px;margin-top:2px}

/* settings summary rows */
.rows{padding:2px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row+.row{border-top:.5px solid var(--sep)}
.row:active{background:var(--neutral-bg)}
.ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--info);flex:0 0 auto}
.ri svg{width:20px;height:20px}
.rl{flex:1;min-width:0}
.rl b{display:block;font-size:15px;font-weight:650}
.rl span{display:block;font-size:13.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:15px;height:15px;color:var(--text-3);flex:0 0 auto}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 0 9px;min-height:98px;display:flex;flex-direction:column;align-items:center}
.day .dn{font-size:11px;font-weight:720;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em}
.day .dd{font-size:18px;font-weight:720;margin:1px 0 6px}
.day .ev{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;line-height:1.1}
.day .ev small{font-size:10px;font-weight:700;color:var(--text-3)}
.day.today{background:linear-gradient(180deg,var(--sky-700),var(--sky-600));color:#fff}
.day.today .dn,.day.today .ev small{color:rgba(255,255,255,.82)}

/* calendar */
.next{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scroll-padding:0 16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.next::-webkit-scrollbar{display:none}
.nx{flex:0 0 auto;min-width:138px;scroll-snap-align:start;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 13px;text-align:left}
.nx .ic{font-size:23px;line-height:1}
.nx b{display:block;font-size:14.5px;font-weight:660;margin-top:8px}
.nx span{display:block;font-size:13px;color:var(--text-2);margin-top:1px}
.nx .chip{margin-top:8px}
.wk{margin-top:18px}
.wk h3{font-size:12.5px;font-weight:720;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin:0 6px 8px}
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.aday{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px 14px;align-items:start;scroll-margin-top:calc(var(--safe-t) + 60px)}
.aday+.aday{border-top:.5px solid var(--sep)}
.aday .dt{text-align:center;padding-top:2px}
.aday .dt .w{font-size:11px;font-weight:720;color:var(--text-3);text-transform:uppercase}
.aday .dt .n{font-size:22px;font-weight:720;line-height:1.1}
.aday.is-today .dt .n,.aday.is-today .dt .w{color:var(--accent)}
.aday .lbl{font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:720;text-transform:uppercase;letter-spacing:.05em}
.aday.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--info-bg)}100%{background:transparent}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--card-2);font-size:14px;font-weight:620;box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.pill small{font-weight:500;color:var(--text-2);font-size:12.5px}
.pill.water{background:var(--info-bg);color:var(--info);box-shadow:none}
.pill.water small{color:var(--info);opacity:.85}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;line-height:1.42;font-weight:560;margin-top:14px}

/* accordions */
details.acc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
details.acc>summary{list-style:none;padding:15px 16px;font-weight:660;font-size:15.5px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.acc-body{padding:0 16px 16px;color:var(--text-2);font-size:14.5px;line-height:1.5}
.acc-body p+p,.acc-body ul+p,.acc-body p+ul{margin-top:10px}
.acc-body ul{padding-left:18px}
.acc-body li+li{margin-top:6px}
.acc-body b{color:var(--text)}
details.inner{box-shadow:none;background:var(--card-2);border-radius:14px;margin-top:12px}
details.inner>summary{padding:12px 14px;font-size:14.5px}
details.inner .acc-body{padding:0 14px 14px}

/* climate */
.dev-h{display:flex;align-items:center;gap:12px}
.dev-h .tile{width:40px;height:40px;border-radius:12px}
.dev-h .tile svg{width:22px;height:22px}
.dev-h .nm{flex:1;min-width:0}
.dev-h b{display:block;font-size:17px;font-weight:720}
.dev-h span{display:block;font-size:13px;color:var(--text-3)}
.lcd{margin:16px 4px 14px;display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:14px;background:var(--lcd-bg);color:var(--lcd-fg);box-shadow:0 0 0 5px var(--lcd-bezel),inset 0 1px 4px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.lcd .m{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:760;letter-spacing:.06em;text-transform:uppercase}
.lcd .m svg{width:34px;height:34px}
.lcd .sp{font-size:10px;font-weight:760;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.lcd .sp b{display:block;font-size:28px;line-height:1.05}
.lcd .rh{margin-left:auto;text-align:right;font-size:10px;font-weight:760;letter-spacing:.06em;text-transform:uppercase}
.lcd .rh b{display:block;font-size:36px;line-height:1;font-weight:720;letter-spacing:-.02em}
.lcd .rh b small{font-size:18px;margin-left:1px}
.lcd.big-only{justify-content:space-between}
.lcd .note{font-size:12.5px;font-weight:650;text-transform:none;letter-spacing:0;opacity:.85;max-width:52%;text-align:left;line-height:1.3}
.why{font-size:14.5px;color:var(--text-2);line-height:1.46}
.seglbl{font-size:11.5px;font-weight:720;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:14px 2px -4px}
.winline{margin-top:10px;font-size:14px;color:var(--ok);font-weight:600;line-height:1.4}
.winline.warn{color:var(--warn)}
.legendline{font-size:12.5px;color:var(--text-3);margin:-4px 4px 10px;font-weight:600}
.from{font-size:13px;color:var(--text-3);margin-top:8px}
.dev-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dev-actions:empty{display:none}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:5px 0 5px 34px;font-size:14.5px;line-height:1.42;color:var(--text)}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:12px;background:var(--step-bg);color:var(--step-fg);font-size:13px;font-weight:760;display:grid;place-items:center}
kbd{display:inline-block;min-width:24px;padding:0 6px;border-radius:6px;background:var(--neutral-bg);box-shadow:inset 0 -1px 0 var(--sep-strong);font:760 12.5px/1.6 inherit;text-align:center;color:var(--text)}
.tipline{font-size:13.5px;color:var(--text-2);margin-top:8px}
.out-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.out-top .big{font-size:40px;font-weight:300;line-height:1;letter-spacing:-.03em}
.out-top .facts{text-align:right;font-size:13.5px;color:var(--text-2);line-height:1.5}
.out-top .facts b{color:var(--text);font-weight:680}
.meter-wrap{margin:18px 2px 0}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#7CC0E6 0%,#86CF95 38%,#86CF95 44%,#F0CD58 56%,#F3A04D 70%,#E8705A 84%,#D8465A 100%)}
.mk{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.35);border:4px solid var(--text)}
.mk.house{width:14px;height:14px;border:3px solid var(--accent)}
.mlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:8px;font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--text-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.verdict{margin-top:12px;font-size:14.5px;font-weight:600;line-height:1.4}
.chart{margin-top:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ct{font-size:12.5px;font-weight:650;color:var(--text-3);margin-bottom:6px}
.b-hum{fill:var(--warn-bg)} .b-mid{fill:var(--neutral-bg)} .gl{stroke:var(--sep-strong);stroke-width:1}
.cl{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cdot{fill:var(--accent);stroke:var(--card);stroke-width:2.5}
.tx{fill:var(--text-3);font-size:10.5px;font-weight:650;font-family:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.seg button{border-radius:11px;padding:10px 8px;background:var(--neutral-bg);font-size:13.5px;font-weight:620;line-height:1.28}
.seg button.on{background:var(--sky-600);color:#fff}
.energy{margin-top:12px;font-size:14.5px;color:var(--text-2);line-height:1.46}
.energy p+p{margin-top:8px}
table.ref{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.ref th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:720;padding:6px 6px 6px 0}
table.ref td{padding:8px 6px 8px 0;border-top:.5px solid var(--sep);vertical-align:top;color:var(--text)}
table.ref+p{margin-top:10px}
.mi{padding:13px 14px;scroll-margin-top:calc(var(--safe-t) + 60px)}
.card{scroll-margin-top:calc(var(--safe-t) + 56px)}
.mi+.mi{border-top:.5px solid var(--sep)}
.mi-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mi-h b{font-size:15px;font-weight:660}
.mi .sub{font-size:13px;color:var(--text-2);margin-top:2px}
.mi .ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mi input[type=date]{height:36px;border-radius:11px;border:0;background:var(--neutral-bg);color:var(--text);padding:0 10px;font:inherit;font-size:14px;color-scheme:light dark}
.mi .ctl a{font-size:14px;font-weight:650;text-decoration:none;padding:0 4px}
.mi .other{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--text-3);font-weight:600}

  e_interlock: 'Mais chaque minute d’échange fait aussi tourner le ventilateur de la fournaise : 350 à 500 W avec un moteur standard, 75 à 125 W avec un moteur ECM. En continu tout l’été, c’est souvent la vraie cause d’une facture plus salée. La minuterie coupe ce temps des deux tiers.',

  e_water: 'Par temps lourd, l’échange continu fait entrer environ un demi-litre à un litre d’eau par heure, que la clim doit ensuite retirer.',
  whyT: 'Pourquoi ces réglages', refT: 'Tableau de référence',
  why: [
    '<b>Les vitesses du 611227.</b> ⇄ 1 tourne en continu à basse vitesse. ⇄ 0 est en attente : l’appareil ne démarre que si l’humidité de la maison dépasse la consigne, et il tourne alors en vitesse 2 (icône de gouttelettes) jusqu’à ce qu’elle redescende. ⏲ fait 20 minutes d’échange puis 40 minutes d’attente, chaque heure.',
    '<b>Le point de rosée</b> mesure la vraie quantité d’eau dans l’air. Quand celui du dehors dépasse celui de la maison (environ 12 °C l’été), chaque bouffée d’air frais ajoute de l’humidité que la clim doit retirer.',
    '<b>L’été ici.</b> Les étés de l’île sont humides : en juillet, le point de rosée de l’après-midi tourne autour de 17 °C. Ventiler en continu fait donc entrer de l’humidité. D’où la minuterie par temps humide, et la consigne à 90 % pour que l’appareil ne se mette jamais en vitesse 2 avec de l’air humide. Aldes le précise : l’appareil n’est pas conçu pour déshumidifier l’été.',
    '<b>Fenêtres ou échangeur.</b> Par temps doux et sec (13 à 25 °C, rosée de 15 °C ou moins, pas de pluie, air sain), les fenêtres font le même travail sans électricité. L’app vous l’offre et vous avertit quand fermer.',
    '<b>L’hiver « humide » de l’île.</b> En janvier, l’humidité dehors tourne autour de 70 % (normales d’Environnement Canada à Montréal-Trudeau) et le vent des lacs rend le froid mordant. Mais de l’air à −10 °C contient très peu d’eau : réchauffé à 21 °C, il tombe à environ 8 %. C’est pour ça que l’échangeur assèche la maison l’hiver et que l’humidificateur reste utile.',
    '<b>Les fenêtres fixent la limite.</b> Plus il fait froid, plus il faut baisser l’humidité pour éviter la condensation ; 30 % reste un bon plancher pour le bois. Les nuits froides et venteuses, la buée arrive plus vite.',
    '<b>La règle d’or</b> (hiver) : consigne de l’échangeur égale à celle de l’humidificateur plus 10. Hors chauffage : 90 %.'
  ],

  tie_interlock: 'Yes, and the furnace fan starts with it', tie_noInterlock: 'Yes, no interlock', tie_dedicated: 'No, separate ducts', tie_unknown: 'Not sure',
  e_base: 'The exchanger itself is frugal: about 30 to 60 W on low.',
  e_interlock: 'But every minute of exchange also runs the furnace fan: 350 to 500 W on a standard motor, 75 to 125 W on an ECM motor. Running nonstop all summer, that is often the real cause of a higher bill. The timer cuts that time by two thirds.',
  e_noInterlock: 'Aldes requires the furnace fan to run whenever the exchanger runs. Left on all summer it draws 350 to 500 W on a standard motor and blows coil moisture back into the house. An interlock fixes both.',
  e_dedicated: 'Your ducts are separate, so the furnace fan doesn’t need to run. The real summer cost is the moisture the AC has to remove.',
  e_unknown: 'To check: thermostat on AUTO with no heating or cooling call, set the exchanger to ⇄ 2. If the furnace fan starts, they’re interlocked. Then put it back to the recommended setting.',
  e_water: 'On muggy days, continuous exchange brings in roughly half a litre to a litre of water per hour, which the AC then has to remove.',
  whyT: 'Why these settings', refT: 'Reference table',
  why: [
    '<b>The 611227’s speeds.</b> ⇄ 1 runs nonstop on low. ⇄ 0 is standby: the unit only starts if indoor humidity passes the setpoint, and then runs on speed 2 (droplets icon) until it drops back. ⏲ does 20 minutes of exchange then 40 minutes of standby, every hour.',
    '<b>Dew point</b> measures how much water is really in the air. When the outdoor dew point is higher than the house’s (about 12 °C in summer), every breath of fresh air adds moisture the AC has to remove.',
    '<b>Summer here.</b> Island summers are humid: in July the afternoon dew point sits around 17 °C. Running the exchanger nonstop therefore brings moisture in. Hence the timer in humid weather, and the 90% setpoint so the unit never kicks into speed 2 with humid air. Aldes says so plainly: the unit isn’t designed to dehumidify in summer.',
    '<b>Windows or exchanger.</b> When it’s mild and dry (13 to 25 °C, dew point of 15 °C or less, no rain, clean air), open windows do the same job with no electricity. The app offers it and tells you when to close.',
    '<b>The island’s “humid” winter.</b> In January outdoor humidity runs around 70% (Environment Canada normals at Montréal-Trudeau) and wind off the lakes gives the cold its bite. But air at −10 °C holds very little water: warmed to 21 °C it drops to about 8%. That’s why the exchanger dries the house in winter and the humidifier still matters.',
    '<b>The windows set the limit.</b> The colder it gets, the lower the humidity must go to avoid condensation; 30% is still a good floor for wood. On cold, windy nights, fog forms sooner.',
    '<b>The golden rule</b> (winter): exchanger setpoint equals the humidifier setpoint plus 10. Outside heating season: 90%.'
  ],

function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }

function buildICS(evs) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');

  for (const e of evs) {

    if (e.rrule) L.push('RRULE:' + e.rrule);

    if (e.desc) L.push('DESCRIPTION:' + icsText(e.desc));

/* ---------- Calendrier ---------- */
let calWeeks = 6;
function renderCalendar() {
  let html = hero({ title: t('tabCal'), sub: t('calSub') }) + '<div class="wrap">';
  const nx = TYPE_ORDER.map(k => ({ k, d: nextOf(k, TODAY) })).filter(x => x.d).sort((a, b) => a.d < b.d ? -1 : 1);
  html += sec(t('nextT')) + '<div class="next">' + nx.map(({ k, d }) => {
    const n = diffDays(TODAY, d);
    return `<button class="nx" data-a="jump" data-v="${d}"><div class="ic">${TYPES[k].icon}</div><b>${t('type_' + k)}</b><span>${cap(fmtDate(d, { weekday: 'short', day: 'numeric', month: 'short' }))}</span>${chip(cdTxt(n), n <= 1 ? 'warn' : 'neutral')}</button>`;
  }).join('') + '</div>';
  const left = LAST_DATE ? diffDays(TODAY, LAST_DATE) : -1;
  if (left < 0) html += `<div class="banner">📅 ${t('ended')}</div>`;
  else if (left <= 45) html += `<div class="banner">📅 ${t('endSoon', { n: left })}</div>`;
  html += sec(t('agendaT'));
  const mon0 = addDays(TODAY, -dowOf(TODAY)); /* semaines du dimanche au samedi, comme le calendrier de NDIP */
  let shown = 0;
  for (let w = 0; w < calWeeks; w++) {
    const mon = addDays(mon0, w * 7); let rows = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(mon, i); if (d < TODAY) continue;
      const evs = eventsOn(d); if (!evs.length) continue;
      const n = diffDays(TODAY, d);
      const pills = evs.map(k => k === 'water' ? `<span class="pill water">💧 ${t('waterPill')} <small>${t('waterPillS')}</small></span>`
        : `<span class="pill">${TYPES[k].icon} ${t('type_' + k)}${k === 'branches' ? ` <small>${t('branchesPillS')}</small>` : ''}</span>`).join('');
      rows += `<div class="aday${n === 0 ? ' is-today' : ''}" id="d-${d}"><div class="dt"><div class="w">${shortDay(d)}</div><div class="n num">${dateOf(d).getDate()}</div></div>
        <div>${n <= 1 ? `<div class="lbl">${n === 0 ? t('lblToday') : t('lblTomorrow')}</div>` : ''}<div class="pills">${pills}</div></div></div>`;
      shown++;
    }
    if (!rows) continue;
    const label = w === 0 ? t('thisWeek') : w === 1 ? t('nextWeek') : t('weekOf', { d: dayMonth(mon) });
    html += `<div class="wk"><h3>${label}</h3><div class="list">${rows}</div></div>`;
  }
  const endShown = addDays(mon0, calWeeks * 7);
  if (LAST_DATE && endShown <= LAST_DATE) html += `<button class="btn block more" data-a="more" style="margin-top:14px">${t('more')}</button>`;
  html += '<div class="stack" style="margin-top:22px">';
  html += `<details class="acc" data-id="rules-bins"><summary>🗑️ ${t('rulesBinsT')}</summary><div class="acc-body"><ul>${tl('rulesBins').map(s => `<li>${s}</li>`).join('')}</ul></div></details>`;
  html += `<details class="acc" data-id="rules-water"><summary>💧 ${t('rulesWaterT')}</summary><div class="acc-body"><ul>${tl('rulesWater').map(s => `<li>${s}</li>`).join('')}</ul></div></details>`;
  html += `</div><p class="foot">${t('srcCal')}</p></div>`;
  $('#page-calendar').innerHTML = html;
}

function lcd(x) {

function statusChip(s) { return s === 'ok' ? chip(I.check.replace('<svg', '<svg style="width:13px;height:13px"') + t('upToDate'), 'ok') : s === 'change' ? chip(t('change'), 'warn') : chip(t('toSet'), 'info'); }
function chartSVG(series, mode) {
  const vals = series.map(h => mode === 'td' ? h.td : h.t);
  if (vals.filter(v => v != null).length < 6) return '';
  const W = 330, H = 124, pl = 28, pr = 10, pt = 8, pb = 22;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (mode === 'td') { lo = Math.min(lo, 9); hi = Math.max(hi, 17); } else { lo = Math.min(lo, 0); hi = Math.max(hi, 2); }
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
  const x = i => pl + i * (W - pl - pr) / (series.length - 1);
  const y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
  let g = '';
  if (mode === 'td') {
    g += `<rect class="b-hum" x="${pl}" y="${y(hi)}" width="${W - pl - pr}" height="${Math.max(0, y(16) - y(hi))}" rx="4"/>`;
    g += `<rect class="b-mid" x="${pl}" y="${y(16)}" width="${W - pl - pr}" height="${Math.max(0, y(13) - y(16))}"/>`;
  }
  const step = hi - lo > 18 ? 10 : hi - lo > 9 ? 5 : 2;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="tx" x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${fmtNum(v)}°</text>`;
  const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  let labels = ''; [0, 6, 12, 18, series.length - 1].forEach(i => { if (series[i]) labels += `<text class="tx" x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? 'start' : i === series.length - 1 ? 'end' : 'middle'}">${i === 0 ? t('now') : hourOf(series[i].time)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(mode === 'td' ? t('chartTd') : t('chartT'))}">${g}<path class="cl" d="${d}"/><circle class="cdot" cx="${pts[0][0]}" cy="${pts[0][1]}" r="4.5"/>${labels}</svg>`;
}

let io = null;
function watchTitle() {
  if (io) io.disconnect();
  const el = document.querySelector('.page.on .lt');
  if (!el || !('IntersectionObserver' in window)) return;
  const top = parseFloat(getComputedStyle(document.querySelector('.scrim')).height) || 0;
  io = new IntersectionObserver(([e]) => document.body.classList.toggle('scrolled', !e.isIntersecting), { rootMargin: '-' + (top + 44) + 'px 0px 0px 0px' });
  io.observe(el);
}
const scrollPos = {};
function go(tab) {
  if (tab === S.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  scrollPos[S.tab] = window.scrollY; S.tab = tab; persist();
  renderTabbar(); showTab(); window.scrollTo(0, scrollPos[tab] || 0);
}
let toastTimer = null;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1900); }
function jumpTo(id) {
  requestAnimationFrame(() => { const el = document.getElementById(id); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'tab') go(el.dataset.v);
  else if (a === 'lang') { S.lang = S.lang === 'fr' ? 'en' : 'fr'; persist(); renderAll(); }
  else if (a === 'ack') { S.ack[el.dataset.k] = TODAY; persist(); renderAll(); toast(t('noted')); }
  else if (a === 'unack') { delete S.ack[el.dataset.k]; if (el.dataset.task) delete S.tasks[el.dataset.task]; persist(); renderAll(); }
  else if (a === 'apply') { S.applied[el.dataset.dev] = el.dataset.v; persist(); renderAll(); toast(t('appliedToast')); }
  else if (a === 'task') { const task = TASKS.find(x => x.id === el.dataset.id); if (task) { S.tasks[taskKey(task, N)] = TODAY; if (task.done) task.done(); persist(); renderAll(); toast(t('noted')); } }
  else if (a === 'maint') { S.maint[el.dataset.id] = TODAY; persist(); renderAll(); toast(t('noted')); }
  else if (a === 'gomaint') { go('climate'); jumpTo('m-' + el.dataset.v); }
  else if (a === 'how') { OPEN.add(el.dataset.v); go('climate'); const d = document.querySelector('details[data-id="' + el.dataset.v + '"]'); if (d) { d.open = true; requestAnimationFrame(() => d.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' })); } }
  else if (a === 'setup') { S.setup.tie = el.dataset.v; persist(); renderAll(); }
  else if (a === 'winOpen') { S.win = { open: true, at: now().getTime() }; S.applied.exchanger = 'exch|0|90'; persist(); renderAll(); toast(t('winOpenToast')); }
  else if (a === 'winSetOpen') { if (!winOpen(now())) { S.win = { open: true, at: now().getTime() }; persist(); renderAll(); } }
  else if (a === 'winKeep') { S.ack['winOffer|' + TODAY] = TODAY; persist(); renderAll(); }
  else if (a === 'winClosed') { if (winOpen(now())) { S.win = { open: false, at: now().getTime() }; S.ack['winOffer|' + TODAY] = TODAY; persist(); renderAll(); } }
  else if (a === 'winCloseDone') { S.win = { open: false, at: now().getTime() }; S.applied.exchanger = REC.base.key; S.ack['winOffer|' + TODAY] = TODAY; persist(); renderAll(); toast(t('noted')); }
  else if (a === 'humOn') { S.hum = { on: true, at: TODAY }; persist(); renderAll(); toast(t('noted')); }
  else if (a === 'humOff') { S.hum = { on: false, at: TODAY }; S.applied.humidifier = 'off'; persist(); renderAll(); toast(t('noted')); }
  else if (a === 'remind') openReminders([el.dataset.v]);
  else if (a === 'remindAll') openReminders(['humStart', 'humStop', 'winter', 'irrigOn', 'maint:furnaceFilter', 'maint:hrvFilters', 'maint:hrvCore', 'maint:hrvDrain']);
  else if (a === 'ics') downloadICS();
  else if (a === 'sheetClose') $('#sheet').hidden = true;
  else if (a === 'more') { calWeeks += 6; renderCalendar(); document.querySelectorAll('#page-calendar details[data-id]').forEach(d => { if (OPEN.has(d.dataset.id)) d.open = true; }); watchTitle(); }
  else if (a === 'jump') { const d = el.dataset.v; if (S.tab !== 'calendar') go('calendar'); const need = diffDays(TODAY, d); if (need > calWeeks * 7 - 7) { calWeeks = Math.ceil(need / 7) + 2; renderCalendar(); } jumpTo('d-' + d); }
  else if (a === 'refresh') refresh(true);
});
document.addEventListener('change', e => {
  const inp = e.target.closest('input[data-maint]'); if (!inp) return;
  if (inp.value) S.maint[inp.dataset.maint] = inp.value; else delete S.maint[inp.dataset.maint];
  persist(); renderAll();
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-id]')) { if (d.open) OPEN.add(d.dataset.id); else OPEN.delete(d.dataset.id); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#sheet').hidden = true; });

async function refresh(force) {
  const ok = await fetchWeather(force);
  renderAll();
  if (force) toast(ok ? t('wxUpdated') : t('wxFailed'));
}
/* Ménage des accusés de réception de plus de 14 jours */
(function cleanAcks() {
  const lim = addDays(isoOf(now()), -14);
  for (const k in S.ack) if (typeof S.ack[k] !== 'string' || (S.ack[k] < lim && k !== 'install')) delete S.ack[k];
  persist();
})();

renderAll();
refresh(false);
let lastMin = -1;
setInterval(() => { const m = now().getMinutes(); if (m !== lastMin) { lastMin = m; renderAll(); } }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(false); });
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
window.__mcnabb = { derive, recommend, buildICS, remSpec, state: S };
})();
</script>
